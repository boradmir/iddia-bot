name: Sonuçlar ve puanlama

on:
  schedule:
    - cron: "40 4 * * *"      # her gün 04:40 UTC: önceki günün skorları → uyarı/kupon puanlama → sayfa
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skorları çek ve puanla
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python results.py --days 3
          python settle.py
          python build_site.py
      - name: Repoya yaz
        run: |
          git config user.name "iddia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add records/ docs/
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "sonuçlar $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break || sleep 5; done
