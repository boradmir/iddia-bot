name: Oran kaydı

# Zamanlama artık Bekçi'de (keeper.yml). Bu iş akışı elle çalıştırma için duruyor.
on:
  workflow_dispatch:
    inputs:
      pinnacle:
        description: "Pinnacle da çekilsin mi?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kaydet
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ inputs.pinnacle }}" = "true" ]; then
            python record_once.py --pinnacle
          else
            python record_once.py
          fi
      - name: Sayfayı üret
        env:
          PYTHONIOENCODING: utf-8
        run: python build_site.py --record-coupons
      - name: Repoya yaz
        run: |
          git config user.name "iddia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add records/ docs/
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "kayıt $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
