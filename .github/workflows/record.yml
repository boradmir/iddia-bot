name: Oran kaydı

on:
  schedule:
    - cron: "*/20 * * * *"        # her 20 dk: sadece Nesine (bedava)
    - cron: "5 10 * * *"          # günde 1 kez: Nesine + Pinnacle (Odds API ücretsiz kota 500/ay)
  workflow_dispatch:
    inputs:
      pinnacle:
        description: "Pinnacle da çekilsin mi?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kaydet
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event.schedule }}" = "5 10 * * *" ] || [ "${{ inputs.pinnacle }}" = "true" ]; then
            python record_once.py --pinnacle
          else
            python record_once.py
          fi
      - name: Sayfayı üret
        env:
          PYTHONIOENCODING: utf-8
        run: python build_site.py
      - name: Repoya yaz
        run: |
          git config user.name "iddia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add records/ docs/
          git diff --cached --quiet && echo "değişiklik yok" && exit 0
          git commit -m "kayıt $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
